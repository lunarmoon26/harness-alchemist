name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node, Rust, and package verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  bun:
    name: Bun 1.2 launcher compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.20.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.0
      - run: npm ci
      - run: npm run build
      - run: node --test --test-name-pattern="creates and validates a project under Bun" tests/cli.test.mjs

  native-platforms:
    name: Native smoke ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: harness-alchemist
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: harness-alchemist
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: harness-alchemist
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: harness-alchemist
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: harness-alchemist.exe
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable: harness-alchemist.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: rustup target add "$TARGET"
      - env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: cargo build --release --locked --target "$TARGET"
      - name: Smoke-test native binary
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
          TARGET: ${{ matrix.target }}
        run: |
          "./target/${TARGET}/release/${EXECUTABLE}" version
