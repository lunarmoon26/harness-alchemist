[package]
name = "harness-alchemist"
version = "0.2.0-alpha.1"
edition = "2024"
license = "MIT"
description = "Native CLI for scaffolding and validating portable coding-agent plugins"
repository = "https://github.com/lunarmoon26/harness-alchemist"
build = "build.rs"

[[bin]]
name = "harness-alchemist"
path = "rust/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
libc = "0.2.177"
regex = "1.12.2"
ruff_python_parser = "0.0.13"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
toml = "0.9.8"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }
wait-timeout = "0.2.1"

[build-dependencies]
serde_json = "1.0.145"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
